server.port=${PORT:8080}

spring.application.name=task-list

# Datenbank: Werte kommen ausschließlich aus Umgebungsvariablen (keine Secrets im Code)
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}

# Das Schema verwaltet Flyway (src/main/resources/db/migration).
# Hibernate prüft beim Start nur, ob Entity und Tabelle zusammenpassen.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Bestehende Datenbanken ohne Flyway-Historie (aus der Zeit von ddl-auto=update)
# werden auf Version 0 gesetzt; danach laufen V1 und V2 und erhalten alle Zeilen.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Erlaubte Frontend-Adressen (kommagetrennt). Auf Render per FRONTEND_URL setzen.
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:4173,https://todo-list-frontend-165i.onrender.com}

# Health-Check für Render: GET /actuator/health (ohne Details nach außen)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Keine Stacktraces oder Exception-Texte in Fehlerantworten
server.error.include-stacktrace=never
server.error.include-message=never
