name: Backend CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests (PostgreSQL via Testcontainers) und Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Cacht Gradle-Abhängigkeiten; Versionen sind über den Gradle-Wrapper fest
      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers startet eine isolierte PostgreSQL-Instanz im Docker des Runners.
      # Es wird keine produktive Datenbank und kein Secret benötigt.
      - name: Tests und Build
        run: ./gradlew test bootJar --no-daemon

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: build/reports/tests/test

  docker-image:
    name: Docker-Image baut (wie auf Render)
    runs-on: ubuntu-latest
    needs: test-and-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Docker-Build
        run: docker build --tag todo-list-backend:ci .
